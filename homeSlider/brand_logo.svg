<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" fill="none">
  <defs>
    <!-- Soft Glow and Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C669"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#C58721"/>
    </linearGradient>
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A8F99"/>
      <stop offset="50%" stop-color="#E1E4EA"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="centerYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#E6A100"/>
    </linearGradient>
  </defs>

  <!-- ================= LOGO BADGE (Circle + Emblem) ================= -->
  <g transform="translate(4, 4)" filter="url(#badgeShadow)">
    <!-- Outer Silver Outer Rim -->
    <circle cx="36" cy="36" r="35" fill="url(#silverRing)" />
    <!-- Outer Dark Border -->
    <circle cx="36" cy="36" r="33.5" fill="#2B2F38" />
    <!-- White Inner Shield Base -->
    <circle cx="36" cy="36" r="31.5" fill="#FFFFFF" />
    <circle cx="36" cy="36" r="30" fill="#FFFFFF" stroke="#E2E5EB" stroke-width="0.8" />

    <!-- 'M' Emblem Geometry -->
    <!-- Left Red Wing -->
    <polygon points="21,21 31,26 31,44 21,50" fill="#D31820" />
    <polygon points="21,21 26,23.5 26,47 21,50" fill="#B71219" />

    <!-- Right Red Wing -->
    <polygon points="51,21 41,26 41,44 51,50" fill="#D31820" />
    <polygon points="51,21 46,23.5 46,47 51,50" fill="#F0242D" />

    <!-- Center Yellow / Gold Arrow Chevron -->
    <polygon points="31,26 36,29 41,26 36,46" fill="url(#centerYellow)" />
    <polygon points="31,26 36,29 36,46" fill="#F59E0B" />

    <!-- Subtle 'Manoj Associates' under emblem inside circle -->
    <text x="36" y="55" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="5" fill="#1F2937" text-anchor="middle" letter-spacing="0.3">MANOJ</text>
    <text x="36" y="59" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="3.2" fill="#4B5563" text-anchor="middle" letter-spacing="0.4">ASSOCIATES</text>
  </g>

  <!-- ================= UNIFIED BRAND TYPOGRAPHY ================= -->
  <!-- Main Company Name -->
  <text x="90" y="42" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="0.8">
    MANOJ ASSOCIATES
  </text>

  <!-- Tagline / Descriptor -->
  <text x="91" y="59" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" fill="url(#goldGrad)" letter-spacing="2.4">
    CONSTRUCTION EXCELLENCE
  </text>
</svg>
